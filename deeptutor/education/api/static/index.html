<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Practice</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
         background: #f6f7f9; color: #1c1f23; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 20px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 14px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .node { font-size: 13px; color: #6b7280; margin-bottom: 10px; }
  .node b { color: #374151; }
  .prompt { font-size: 19px; white-space: pre-wrap; margin-bottom: 18px; }
  input[type=text] { width: 100%; box-sizing: border-box; font-size: 19px; padding: 12px 14px;
                     border: 2px solid #d1d5db; border-radius: 10px; }
  input[type=text]:focus { outline: none; border-color: #2563eb; }
  button { font-size: 17px; padding: 12px 22px; border: 0; border-radius: 10px;
           background: #2563eb; color: #fff; cursor: pointer; margin-top: 14px; }
  button:disabled { background: #9ca3af; cursor: default; }
  .who-grid { display: grid; gap: 12px; }
  .who { display: block; width: 100%; text-align: left; background: #fff; color: #1c1f23;
         border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px 20px; font-size: 19px;
         cursor: pointer; margin: 0; }
  .who:hover { border-color: #2563eb; }
  .who small { display: block; color: #6b7280; font-size: 13px; margin-top: 3px; }
  .verdict { font-size: 18px; font-weight: 600; margin-top: 16px; }
  .ok { color: #047857; } .no { color: #b91c1c; } .muted { color: #6b7280; font-weight: 400; font-size: 14px; }
  .bar { height: 8px; background: #e5e7eb; border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar > span { display: block; height: 100%; background: #10b981; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 5px 0; border-bottom: 1px solid #f0f1f3; vertical-align: top; }
  td.s { text-align: right; color: #6b7280; white-space: nowrap; }
  .attrib { font-size: 11px; color: #9ca3af; margin-top: 14px; line-height: 1.4; }
  .switch { font-size: 13px; color: #2563eb; cursor: pointer; text-decoration: underline; }
  .pending { border-left: 3px solid #f59e0b; padding-left: 12px; margin-bottom: 14px; }
  .pending .q { font-size: 14px; color: #6b7280; }
  .pending .a { font-size: 15px; margin-top: 4px; white-space: pre-wrap; }
  .judge-row { margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .judge-row .j { font-size: 14px; padding: 6px 12px; margin-top: 0; background: #f3f4f6;
                  color: #1c1f23; border: 1px solid #d1d5db; }
  .judge-row .j:hover { border-color: #2563eb; }
  .judge-row .result { font-size: 13px; }
  .qnum { font-size: 12px; color: #9ca3af; letter-spacing: .04em; text-transform: uppercase; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; margin-top: 8px;
         border: 1px solid #e5e7eb; border-radius: 10px; cursor: pointer; font-size: 16px; }
  .opt:hover { border-color: #2563eb; }
  .opt input { margin-top: 4px; flex: none; }
  .opt.picked { border-color: #2563eb; background: #eff6ff; }
  .opt .lab { font-weight: 600; flex: none; }
  .rev { border-left: 3px solid #e5e7eb; padding-left: 12px; margin-bottom: 16px; }
  .rev.ok { border-left-color: #047857; } .rev.no { border-left-color: #b91c1c; }
  .rev.wait { border-left-color: #f59e0b; }
  .rev .q { font-size: 15px; white-space: pre-wrap; margin-bottom: 6px; }
  .rev .line { font-size: 14px; margin-top: 3px; }
  .rev .exp { font-size: 14px; background: #f9fafb; border-radius: 8px; padding: 10px 12px;
              margin-top: 8px; white-space: pre-wrap; }
  .rev .kp { font-size: 12px; color: #6b7280; margin-top: 6px; }
  .todo { color: #b45309; }
</style>
</head>
<body>
<main>
  <h1 id="h1title">Practice</h1>
  <div class="sub" id="who"></div>
  <!-- 选了多门课才出现的课程切换条；只有一门时留空，界面和以前一样 -->
  <div class="sub" id="courseBar"></div>

  <!-- 落地页：先问谁在用。这不是登录（Access 已经确认过是家里人），
       只是让系统知道这次的作答该记在谁名下。 -->
  <div id="pickView" style="display:none">
    <div class="card"><div class="node"><b>谁在用？</b></div>
      <div class="who-grid" id="people"></div>
    </div>
  </div>

  <!-- 一次一组题，全部答完再提交；答案与讲解在提交之后的 reviewView 里给 -->
  <div id="practiceView" style="display:none">
    <div id="questions"></div>
    <div class="card">
      <button id="submit">提交这一组</button>
      <div class="verdict muted" id="submitHint"></div>
    </div>
    <div class="card">
      <div class="node"><b>Progress</b> <span id="counts"></span></div>
      <div class="bar"><span id="barFill" style="width:0%"></span></div>
      <table id="progress"></table>
    </div>
  </div>

  <!-- 复盘：整组交完之后才出现的答案 + 讲解 + 关联知识点 -->
  <div id="reviewView" style="display:none">
    <div class="card">
      <div class="node"><b>这一组的结果</b></div>
      <div class="verdict" id="score"></div>
    </div>
    <div id="reviewList"></div>
    <div class="card"><button id="again">再来一组</button></div>
  </div>

  <div id="parentView" style="display:none">
    <div class="card">
      <div class="node"><b>待人工复核</b> <span class="muted">AI 判不了或没把握的作答</span></div>
      <div id="pending"></div>
    </div>
    <div class="card">
      <div class="node"><b>各人进度</b></div>
      <div id="parentProgress"></div>
    </div>
  </div>
</main>
<script>
const params = new URLSearchParams(location.search);
const CVKEY = 'edu.cv';
// 课表拿不到时的退路：回到本文件从前写死的那门课。宁可退回"只有数学"，
// 也不能让孩子开屏看到空白。
const FALLBACK_CV = 'cv-ccss-g4-1.0.0';
let CV = params.get('cv') || localStorage.getItem(CVKEY) || FALLBACK_CV;
let courses = [];
const KEY = 'edu.person';
let person = null;   // {id, display_name, role}

const $ = id => document.getElementById(id);
// 凡是进 innerHTML 的动态值都过这里。孩子的作答是真正的用户输入：
// 一句 <img src=x onerror=...> 就会在家长打开复核页时执行。题面与节点标题
// 来自 seeds，风险低但同样转义 —— 逐个判断"这条可信吗"迟早会判错一次。
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
// 新增视图必须同时加进这张表，否则 show('新视图') 会把所有视图一起藏起来、
// 且不报任何错（2026-08-21 实测踩到：复盘页写好了、内容也渲染了，就是不显示）。
const show = v => ['pickView', 'practiceView', 'reviewView', 'parentView']
  .forEach(x => $(x).style.display = x === v ? '' : 'none');

async function boot() {
  const people = (await (await fetch('/api/edu/people')).json()).people;
  const savedId = params.get('as') || localStorage.getItem(KEY);
  const saved = people.find(p => p.id === savedId);
  if (saved) return enter(saved, people);

  $('people').innerHTML = '';
  people.forEach(p => {
    const b = document.createElement('button');
    b.className = 'who';
    b.innerHTML = `${esc(p.display_name)}<small>${p.role === 'parent' ? '只看进度，不做题' : '开始练习'}</small>`;
    b.onclick = () => enter(p, people);
    $('people').appendChild(b);
  });
  show('pickView');
}

function switcher(label) {
  $('who').innerHTML = `${esc(label)} · <span class="switch" id="switchWho">换人</span>`;
  $('switchWho').onclick = () => { localStorage.removeItem(KEY); location.href = location.pathname; };
}

// 课程来自 enrollments，不再写死。在这以前 enrollments 表运行时没有任何消费方：
// 给谁选了课都不影响任何人看到什么。
async function loadCourses() {
  try {
    const r = await fetch(`/api/edu/courses?learner_id=${encodeURIComponent(person.id)}`);
    courses = r.ok ? (await r.json()).courses : [];
  } catch (e) { courses = []; }
  if (!courses.length) { CV = params.get('cv') || FALLBACK_CV; return; }
  const want = params.get('cv') || localStorage.getItem(CVKEY);
  CV = courses.some(c => c.course_version_id === want) ? want : courses[0].course_version_id;
  localStorage.setItem(CVKEY, CV);
}

function renderCourses() {
  const cur = courses.find(c => c.course_version_id === CV);
  $('h1title').textContent = cur ? cur.title : 'Practice';
  document.title = cur ? cur.title : 'Practice';
  if (courses.length < 2) { $('courseBar').innerHTML = ''; return; }
  $('courseBar').innerHTML = courses.map(c => c.course_version_id === CV
    ? `<b>${esc(c.title)}</b>`
    : `<span class="switch" data-cv="${esc(c.course_version_id)}">${esc(c.title)}</span>`).join(' · ');
  $('courseBar').querySelectorAll('[data-cv]').forEach(el => el.onclick = () => {
    localStorage.setItem(CVKEY, el.dataset.cv);
    location.href = location.pathname;  // 换课整页重来，免得半截状态串到别的课上
  });
}

async function enter(p, people) {
  person = p;
  localStorage.setItem(KEY, p.id);
  await loadCourses();
  renderCourses();
  if (p.role === 'parent') { switcher('家长视角'); show('parentView'); loadParent(people); }
  else { switcher(p.display_name); loadSet(); loadProgress(); }
}

// ---------- 孩子：一组题 ----------
//
// Sol 2026-08-21：出题时不给答案，答案要等**整组**提交之后才给，而且要说清
// 为什么、关联哪个知识点。所以这里不再是"答一题→立刻判对错→自动跳下一题"，
// 而是 组卷 → 全部作答 → 一次提交 → 复盘。
// 题量由服务端定（EDU_SET_SIZE，默认 5）。前端不再传 size：让客户端自选
// "这一组就一道题"、交上去立刻拿答案，等于逐题即时反馈。
let setItems = [];      // 本组题面（不含答案）
let setId = null;       // 服务端发的组 id；交卷时必须原样带回
let blankConfirms = 0;

async function loadSet() {
  show('practiceView');
  $('questions').innerHTML = '<div class="card"><div class="prompt">Loading…</div></div>';
  $('submitHint').textContent = '';
  $('submit').disabled = true;
  blankConfirms = 0;
  // POST 不是 GET：发卷会在服务端落一行 task_sets，GET 语义上应当是安全的。
  const r = await fetch(`/api/edu/set?learner_id=${encodeURIComponent(person.id)}`
    + `&course_version_id=${encodeURIComponent(CV)}`, {method: 'POST'});
  if (!r.ok) {
    $('questions').innerHTML = `<div class="card"><div class="prompt">Error ${r.status}</div></div>`;
    return;
  }
  const d = await r.json();
  setItems = d.items || [];
  setId = d.set_id;
  if (!setItems.length) {
    $('questions').innerHTML = '<div class="card"><div class="prompt">'
      + (d.done ? '🎉 Everything is mastered.' : esc(d.message || '暂时没有可做的题'))
      + '</div></div>';
    return;
  }
  $('questions').innerHTML = setItems.map(renderQuestion).join('');
  wireOptions();
  $('submit').disabled = false;
}

function renderQuestion(item, i) {
  const kp = item.node
    ? `<div class="node"><b>${esc(item.node.title)}</b> · ${esc(item.node.code)}`
      + `${item.node.standard_code ? ' · ' + esc(item.node.standard_code) : ''}</div>`
    : '';
  // 选择题发单选按钮。此前选项拼在 prompt 散文里，孩子只能手打字母。
  const body = item.choices
    ? item.choices.map(c => `<label class="opt">`
        + `<input type="radio" name="q${i}" value="${esc(c.label)}">`
        + `<span class="lab">${esc(c.label)}</span><span>${esc(c.text)}</span></label>`).join('')
    : `<input type="text" id="a${i}" autocomplete="off" autocapitalize="off"
              spellcheck="false" placeholder="Your answer">`;
  return `<div class="card">
    <div class="qnum">Question ${i + 1} / ${setItems.length}</div>
    ${kp}
    <div class="prompt">${esc(item.prompt)}</div>
    ${body}
    ${item.attribution ? `<div class="attrib">${esc(item.attribution)}</div>` : ''}
  </div>`;
}

function wireOptions() {
  document.querySelectorAll('.opt input').forEach(input => {
    input.addEventListener('change', () => {
      document.querySelectorAll(`.opt input[name="${input.name}"]`)
        .forEach(o => o.closest('.opt').classList.toggle('picked', o.checked));
    });
  });
}

function collectAnswers() {
  return setItems.map((item, i) => {
    const picked = document.querySelector(`input[name="q${i}"]:checked`);
    const typed = $(`a${i}`);
    // 幂等键由服务端从 (组, 题) 派生 —— 客户端自选的话，重试时换个新键就等于
    // 自己把去重关掉了（第五轮质检席实测：3 路并发即让同一题落 2 条矛盾作答）。
    return {
      item_id: item.id,
      response: picked ? picked.value : (typed ? typed.value : ''),
    };
  });
}

async function submitSet() {
  if (!setItems.length) return;
  const answers = collectAnswers();
  const blank = answers.filter(a => !a.response.trim()).length;
  // 不硬拦空白：留白本身也是证据。但要让孩子确认这是有意的，别手滑交白卷。
  if (blank && ++blankConfirms < 2) {
    $('submitHint').textContent = `还有 ${blank} 题没作答。再点一次就按空白交上去。`;
    $('submit').textContent = '确认提交（含空白）';
    return;
  }
  $('submit').disabled = true;
  $('submitHint').textContent = '判分中…';
  const r = await fetch('/api/edu/set/submit', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({learner_id: person.id, course_version_id: CV, set_id: setId, answers}),
  });
  const d = await r.json();
  if (!r.ok) {
    $('submitHint').textContent = d.detail || `Error ${r.status}`;
    $('submit').disabled = false;
    return;
  }
  renderReview(d);
  await loadProgress();
}

const SOURCE_LABEL = {
  publisher_official: '出版社官方解答', authored: '自撰', derived: '由推导答案倒推',
};

function renderReview(d) {
  const s = d.summary;
  $('score').innerHTML = `答对 ${s.correct} / ${s.auto_graded}`
    + (s.awaiting_review ? ` <span class="muted">· ${s.awaiting_review} 题等大人看</span>` : '');
  $('reviewList').innerHTML = d.results.map((r, i) => {
    const cls = r.needs_judgment ? 'wait' : (r.is_correct ? 'ok' : 'no');
    const mark = r.needs_judgment ? '等大人看' : (r.is_correct ? '✓ 对' : '✗ 错');
    const label = v => {
      const c = (r.choices || []).find(x => x.label === v);
      return c ? `${esc(v)}. ${esc(c.text)}` : esc(v || '（空白）');
    };
    // 讲解缺了就明说，不编：全库 179 题只有 19 题有出版社官方解答。
    const exp = r.explanation
      ? `<div class="exp">${esc(r.explanation)}</div><div class="kp">讲解来源：`
        + `${esc(SOURCE_LABEL[r.explanation_source] || r.explanation_source || '未标注')}</div>`
      : '<div class="exp todo">讲解待补 —— 这道题还没有可信的讲解，先看下面的知识点。</div>';
    const kp = r.knowledge_point
      ? `<div class="kp">关联知识点：<b>${esc(r.knowledge_point.title)}</b> · `
        + `${esc(r.knowledge_point.code)}`
        + `${r.knowledge_point.standard_code ? ' · ' + esc(r.knowledge_point.standard_code) : ''}</div>`
      : '';
    return `<div class="card"><div class="rev ${cls}">
      <div class="qnum">Question ${i + 1} · ${mark}</div>
      <div class="q">${esc(r.prompt)}</div>
      <div class="line">你的答案：${label(r.your_response)}</div>
      ${r.needs_judgment ? '' : `<div class="line">正确答案：${label(r.correct_answer)}</div>`}
      ${exp}${kp}
    </div></div>`;
  }).join('');
  show('reviewView');
}

async function loadProgress() {
  const r = await fetch(`/api/edu/progress?learner_id=${encodeURIComponent(person.id)}&course_version_id=${encodeURIComponent(CV)}`);
  if (!r.ok) return;
  const d = await r.json();
  const total = d.nodes.length, mastered = d.counts.mastered || 0;
  $('counts').textContent = `${mastered}/${total} mastered · ${d.counts.learning || 0} learning`;
  $('barFill').style.width = `${total ? (mastered / total * 100) : 0}%`;
  $('progress').innerHTML = d.nodes.filter(n => n.status !== 'new').slice(0, 12)
    .map(n => `<tr><td>${esc(n.title)}</td><td class="s">${esc(n.status)}${n.score !== null ? ' · ' + n.score : ''}</td></tr>`)
    .join('') || '<tr><td class="s">还没有作答</td></tr>';
}

// ---------- 家长：只读 ----------
async function loadParent(people) {
  const q = await (await fetch(`/api/edu/review-queue?course_version_id=${encodeURIComponent(CV)}`)).json();
  $('pending').innerHTML = q.pending.length ? q.pending.map(p => `
    <div class="pending" data-attempt="${esc(p.attempt_id)}">
      <div class="q"><b>${esc(p.learner_id)}</b> · ${esc(p.node)} · ${esc(p.submitted_at.slice(0, 16).replace('T', ' '))}</div>
      <div class="q">${esc(p.prompt ? p.prompt.slice(0, 160) : '')}</div>
      <div class="a">「${esc(p.answer)}」</div>
      <div class="q">${p.judge ? `AI: ${esc(p.judge.verdict)} (${esc(p.judge.confidence)}) — ${esc(p.judge.rationale || '')}` : 'AI 未给出判定'}</div>
      <div class="judge-row">
        <button class="j" data-v="correct">判为对</button>
        <button class="j" data-v="partial">部分对</button>
        <button class="j" data-v="incorrect">判为错</button>
        <span class="muted result"></span>
      </div>
    </div>`).join('') : '<div class="muted">没有待复核的作答</div>';

  // 人的裁定是追加不是修改：AI 那条判定原样留在证据链里。
  document.querySelectorAll('.pending .j').forEach(btn => {
    btn.onclick = async () => {
      const box = btn.closest('.pending');
      box.querySelectorAll('.j').forEach(b => b.disabled = true);
      const r = await fetch('/api/edu/review', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          reviewer: person.id, attempt_id: box.dataset.attempt, verdict: btn.dataset.v
        })
      });
      const d = await r.json();
      box.querySelector('.result').textContent = r.ok
        ? `已记录：${d.verdict} → ${d.mastery.status} ${d.mastery.score.toFixed(2)}`
        : `失败：${d.detail}`;
      if (r.ok) setTimeout(() => loadParent(people), 1200);
    };
  });

  const learners = people.filter(p => p.role === 'learner');
  const blocks = await Promise.all(learners.map(async p => {
    const d = await (await fetch(`/api/edu/progress?learner_id=${encodeURIComponent(p.id)}&course_version_id=${encodeURIComponent(CV)}`)).json();
    const rows = d.nodes.filter(n => n.status !== 'new')
      .map(n => `<tr><td>${esc(n.title)}</td><td class="s">${esc(n.status)}${n.score !== null ? ' · ' + n.score : ''}</td></tr>`).join('');
    return `<div class="node" style="margin-top:14px"><b>${esc(p.display_name)}</b> · ${d.counts.mastered || 0} mastered · ${d.counts.learning || 0} learning</div>
            <table>${rows || '<tr><td class="s">还没有作答</td></tr>'}</table>`;
  }));
  $('parentProgress').innerHTML = blocks.join('');
}

$('submit').addEventListener('click', submitSet);
$('again').addEventListener('click', () => { $('submit').textContent = '提交这一组'; loadSet(); });
boot();
</script>
</body>
</html>
