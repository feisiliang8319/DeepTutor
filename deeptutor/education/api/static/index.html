<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning</title>
<style>
  :root { color-scheme: light; --action: #2563eb; --line: #d1d5db; --paper: #fff; --ink: #1c1f23; }
  body { margin: 0; font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
         background: #f6f7f9; color: #1c1f23; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 20px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #6b7280; font-size: 14px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 14px; padding: 20px; margin-bottom: 16px; }
  .node { font-size: 13px; color: #6b7280; margin-bottom: 10px; }
  .node b { color: #374151; }
  .prompt { font-size: 19px; white-space: pre-wrap; margin-bottom: 18px; }
  input[type=text] { width: 100%; box-sizing: border-box; font-size: 19px; padding: 12px 14px;
                     border: 2px solid #d1d5db; border-radius: 10px; }
  input[type=text]:focus { outline: none; border-color: #2563eb; }
  button { font-size: 17px; padding: 12px 22px; border: 0; border-radius: 10px;
           background: #2563eb; color: #fff; cursor: pointer; margin-top: 14px; }
  button:disabled { background: #9ca3af; cursor: default; }
  .who-grid { display: grid; gap: 12px; }
  .who { display: block; width: 100%; text-align: left; background: #fff; color: #1c1f23;
         border: 1px solid #e5e7eb; border-radius: 14px; padding: 18px 20px; font-size: 19px;
         cursor: pointer; margin: 0; }
  .who:hover { border-color: #2563eb; }
  .who small { display: block; color: #6b7280; font-size: 13px; margin-top: 3px; }
  .verdict { font-size: 18px; font-weight: 600; margin-top: 16px; }
  .ok { color: #047857; } .no { color: #b91c1c; } .muted { color: #6b7280; font-weight: 400; font-size: 14px; }
  .bar { height: 8px; background: #e5e7eb; border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .bar > span { display: block; height: 100%; background: #10b981; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 5px 0; border-bottom: 1px solid #f0f1f3; vertical-align: top; }
  td.s { text-align: right; color: #6b7280; white-space: nowrap; }
  .attrib { font-size: 11px; color: #9ca3af; margin-top: 14px; line-height: 1.4; }
  .switch { font-size: 13px; color: #2563eb; cursor: pointer; text-decoration: underline; }
  .pending { border-left: 3px solid #f59e0b; padding-left: 12px; margin-bottom: 14px; }
  .pending .q { font-size: 14px; color: #6b7280; }
  .pending .a { font-size: 15px; margin-top: 4px; white-space: pre-wrap; }
  .judge-row { margin-top: 8px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .judge-row .j { font-size: 14px; padding: 6px 12px; margin-top: 0; background: #f3f4f6;
                  color: #1c1f23; border: 1px solid #d1d5db; }
  .judge-row .j:hover { border-color: #2563eb; }
  .judge-row .result { font-size: 13px; }
  .qnum { font-size: 12px; color: #9ca3af; letter-spacing: .04em; text-transform: uppercase; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; margin-top: 8px;
         border: 1px solid #e5e7eb; border-radius: 10px; cursor: pointer; font-size: 16px; }
  .opt:hover { border-color: #2563eb; }
  .opt input { margin-top: 4px; flex: none; }
  .opt.picked { border-color: #2563eb; background: #eff6ff; }
  .opt .lab { font-weight: 600; flex: none; }
  .rev { border-left: 3px solid #e5e7eb; padding-left: 12px; margin-bottom: 16px; }
  .rev.ok { border-left-color: #047857; } .rev.no { border-left-color: #b91c1c; }
  .rev.wait { border-left-color: #f59e0b; }
  .rev .q { font-size: 15px; white-space: pre-wrap; margin-bottom: 6px; }
  .rev .line { font-size: 14px; margin-top: 3px; }
  .rev .exp { font-size: 14px; background: #f9fafb; border-radius: 8px; padding: 10px 12px;
              margin-top: 8px; white-space: pre-wrap; }
  .rev .kp { font-size: 12px; color: #6b7280; margin-top: 6px; }
  .todo { color: #b45309; }
  select { width: 100%; box-sizing: border-box; padding: 12px; font: inherit; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); color: var(--ink); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  button.secondary { background: var(--paper); color: var(--action); border: 1px solid var(--line); }
  button:focus-visible, select:focus-visible, a:focus-visible { outline: 3px solid var(--action); outline-offset: 3px; }
  #pageError { color: #b91c1c; padding: 12px 0; overflow-wrap: anywhere; }
</style>
</head>
<body>
<main>
  <h1 id="h1title">Learning</h1>
  <div class="sub" id="who"></div>
  <!-- 选了多门课才出现的课程切换条；只有一门时留空，界面和以前一样 -->
  <div class="sub" id="courseBar"></div>
  <div id="pageError" role="alert" hidden></div>

  <!-- Native account mode selects the server-verified profile automatically. -->
  <div id="pickView" style="display:none">
    <div class="card"><div class="node"><b>谁在用？</b></div>
      <div class="who-grid" id="people"></div>
    </div>
  </div>

  <div id="studyView" style="display:none">
    <div class="card">
      <div class="node"><b>Choose what to explore</b></div>
      <p>先读讲义，或直接选择感兴趣的主题。练习是可选的，学习记录只提供建议，不锁定下一课。</p>
      <div id="courseContent" aria-live="polite"></div>
    </div>
    <div class="card">
      <label for="topic"><b>选择主题</b></label>
      <p class="muted">没有先修闯关要求。暂无练习的主题仍可阅读相关讲义。</p>
      <select id="topic"><option value="">正在读取主题…</option></select>
      <div class="actions">
        <button id="startPractice">开始可选练习</button>
        <button id="resumePractice" class="secondary" hidden>继续未提交练习</button>
        <button id="familyReview" class="secondary" hidden>家长复核与进度</button>
      </div>
      <p class="muted" id="topicHint"></p>
    </div>
  </div>

  <!-- Optional exercise; leaving it never fabricates completed learning evidence. -->
  <div id="practiceView" style="display:none">
    <button class="secondary backToStudy">返回讲义与主题</button>
    <div id="questions"></div>
    <div class="card">
      <button id="submit">提交这一组</button>
      <div class="verdict muted" id="submitHint"></div>
    </div>
    <div class="card">
      <div class="node"><b>Progress</b> <span id="counts"></span></div>
      <div class="bar"><span id="barFill" style="width:0%"></span></div>
      <table id="progress"></table>
    </div>
  </div>

  <!-- 复盘：整组交完之后才出现的答案 + 讲解 + 关联知识点 -->
  <div id="reviewView" style="display:none">
    <div class="card">
      <div class="node"><b>这一组的结果</b></div>
      <div class="verdict" id="score"></div>
    </div>
    <div id="reviewList"></div>
    <div class="card actions"><button id="again">继续自选练习</button><button class="secondary backToStudy">返回讲义与主题</button></div>
  </div>

  <div id="parentView" style="display:none">
    <button class="secondary backToStudy">讲义与学习内容</button>
    <div class="card">
      <div class="node"><b>待人工复核</b> <span class="muted">AI 判不了或没把握的作答</span></div>
      <div id="pending"></div>
    </div>
    <div class="card">
      <div class="node"><b>各人进度</b></div>
      <div id="parentProgress"></div>
    </div>
  </div>
</main>
<script>
const params = new URLSearchParams(location.search);
const CVKEY = 'edu.cv';
// The enrolled course list validates this initial preference before use.
let CV = params.get('cv') || localStorage.getItem(CVKEY);
let courses = [];
const KEY = 'edu.person';
let person = null;   // {id, display_name, role}
let signedIn = false;
let allPeople = [];
let openSetId = null;
let selectedTopic = null;

const $ = id => document.getElementById(id);
// 凡是进 innerHTML 的动态值都过这里。孩子的作答是真正的用户输入：
// 一句 <img src=x onerror=...> 就会在家长打开复核页时执行。题面与节点标题
// 来自 seeds，风险低但同样转义 —— 逐个判断"这条可信吗"迟早会判错一次。
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
// 新增视图必须同时加进这张表，否则 show('新视图') 会把所有视图一起藏起来、
// 且不报任何错（2026-08-21 实测踩到：复盘页写好了、内容也渲染了，就是不显示）。
const show = v => ['pickView', 'studyView', 'practiceView', 'reviewView', 'parentView']
  .forEach(x => $(x).style.display = x === v ? '' : 'none');

function showError(error) {
  $('pageError').textContent = error?.message || '暂时无法加载，请刷新重试。';
  $('pageError').hidden = false;
}
async function apiFetch(url, options) {
  const response = await window.fetch(url, {credentials: 'same-origin', ...options});
  if (response.status === 401) {
    location.href = '/login?next=%2Fpractice';
    throw new Error('请登录后继续学习');
  }
  return response;
}

async function boot() {
  const response = await apiFetch('/api/edu/people');
  const data = await response.json();
  if (!response.ok) throw new Error(data.detail || '无法读取学习档案');
  const people = data.people;
  allPeople = people;
  signedIn = data.account_authenticated;
  const savedId = data.signed_in_profile_id || params.get('as') || localStorage.getItem(KEY);
  const saved = people.find(p => p.id === savedId);
  if (saved) return enter(saved, people);

  $('people').innerHTML = '';
  people.forEach(p => {
    const b = document.createElement('button');
    b.className = 'who';
    b.innerHTML = `${esc(p.display_name)}<small>${p.role === 'parent' ? '讲义、进度与复核' : '选择讲义与主题'}</small>`;
    b.onclick = () => enter(p, people).catch(showError);
    $('people').appendChild(b);
  });
  show('pickView');
}

function switcher(label) {
  $('who').innerHTML = `${esc(label)} · <a class="switch" id="switchWho" href="/login?next=%2Fpractice">${signedIn ? '切换账号' : '换人'}</a>`;
  $('switchWho').onclick = async e => {
    e.preventDefault();
    try {
      if (signedIn) {
        const r = await apiFetch('/api/v1/auth/logout', {method: 'POST'});
        if (!r.ok) throw new Error('暂时无法退出登录');
      }
      localStorage.removeItem(KEY);
      location.href = signedIn ? '/login?next=%2Fpractice' : location.pathname;
    } catch (error) { showError(error); }
  };
}

// 课程来自 enrollments，不再写死。在这以前 enrollments 表运行时没有任何消费方：
// 给谁选了课都不影响任何人看到什么。
async function loadCourses() {
  const r = await apiFetch(`/api/edu/courses?learner_id=${encodeURIComponent(person.id)}`);
  const data = await r.json();
  if (!r.ok) throw new Error(data.detail || '课程暂时无法读取');
  courses = data.courses;
  if (!courses.length) throw new Error('当前账号尚未选课，请由家长安排课程。');
  const want = params.get('cv') || localStorage.getItem(CVKEY);
  CV = courses.some(c => c.course_version_id === want) ? want : courses[0].course_version_id;
  localStorage.setItem(CVKEY, CV);
}

function renderCourses() {
  const cur = courses.find(c => c.course_version_id === CV);
  $('h1title').textContent = cur ? cur.title : 'Practice';
  document.title = cur ? cur.title : 'Practice';
  if (courses.length < 2) { $('courseBar').innerHTML = ''; return; }
  $('courseBar').innerHTML = courses.map(c => c.course_version_id === CV
    ? `<b>${esc(c.title)}</b>`
    : `<span class="switch" data-cv="${esc(c.course_version_id)}">${esc(c.title)}</span>`).join(' · ');
  $('courseBar').querySelectorAll('[data-cv]').forEach(el => el.onclick = () => {
    localStorage.setItem(CVKEY, el.dataset.cv);
    location.href = location.pathname;  // 换课整页重来，免得半截状态串到别的课上
  });
}

async function enter(p, people) {
  person = p;
  localStorage.setItem(KEY, p.id);
  await loadCourses();
  renderCourses();
  switcher(p.role === 'parent' ? '家长视角' : p.display_name);
  await loadStudy();
}

async function loadStudy() {
  $('pageError').hidden = true;
  show('studyView');
  await loadCourseContent();
  const query = `learner_id=${encodeURIComponent(person.id)}&course_version_id=${encodeURIComponent(CV)}`;
  const response = await apiFetch('/api/edu/topics?' + query);
  const data = await response.json();
  if (!response.ok) throw new Error(data.detail || '主题暂时无法读取');
  openSetId = data.open_set_id;
  $('topic').innerHTML = '<option value="">请选择想探索的主题</option>' + data.topics.map(t =>
    `<option value="${esc(t.id)}" ${t.practice_items ? '' : 'disabled'}>${esc(t.title)} · ${t.practice_items ? t.practice_items + ' 道可选练习' : '暂无练习'}</option>`).join('');
  if (selectedTopic) $('topic').value = selectedTopic;
  const parent = person.role === 'parent';
  $('startPractice').hidden = parent;
  $('resumePractice').hidden = parent || (!openSetId && !data.pending_submission);
  $('resumePractice').textContent = data.pending_submission ? '查看已保存答案的判分' : '继续未提交练习';
  $('familyReview').hidden = !parent;
  $('topicHint').textContent = parent ? '家长可以查看讲义与进度，练习记录由学生自己的账号提交。' : '可以随时返回讲义、放下练习或更换主题。';
}

$('startPractice').onclick = async () => {
  $('startPractice').disabled = true;
  try {
    const topic = $('topic').value;
    if (!topic) { $('topic').focus(); throw new Error('先选择你想探索的主题。'); }
    if (openSetId) {
      const hasDraft = Array.from(document.querySelectorAll('#questions input')).some(i => i.type === 'radio' ? i.checked : i.value.trim());
      if (hasDraft && !window.confirm('切换主题会放下当前未提交的答案。继续吗？')) return;
      const skipped = await apiFetch('/api/edu/set/skip', {method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({learner_id:person.id,course_version_id:CV,set_id:openSetId})});
      if (!skipped.ok) throw new Error((await skipped.json()).detail || '无法切换练习');
      openSetId = null;
    }
    selectedTopic = topic;
    await loadSet();
  } catch (error) { showError(error); }
  finally { $('startPractice').disabled = false; }
};
$('resumePractice').onclick = () => { selectedTopic = null; loadSet().catch(showError); };
$('familyReview').onclick = () => { show('parentView'); loadParent(allPeople).catch(showError); };
document.querySelectorAll('.backToStudy').forEach(button => button.onclick = () => loadStudy().catch(showError));

// ---------- 孩子：一组题 ----------
//
// Sol 2026-08-21：出题时不给答案，答案要等**整组**提交之后才给，而且要说清
// 为什么、关联哪个知识点。所以这里不再是"答一题→立刻判对错→自动跳下一题"，
// 而是 组卷 → 全部作答 → 一次提交 → 复盘。
// 题量由服务端定（EDU_SET_SIZE，默认 5）。前端不再传 size：让客户端自选
// "这一组就一道题"、交上去立刻拿答案，等于逐题即时反馈。
let setItems = [];      // 本组题面（不含答案）
let setId = null;       // 服务端发的组 id；交卷时必须原样带回
let blankConfirms = 0;

async function loadSet() {
  show('practiceView');
  $('questions').innerHTML = '<div class="card"><div class="prompt">Loading…</div></div>';
  $('submitHint').textContent = '';
  $('submit').disabled = true;
  blankConfirms = 0;
  $('pageError').hidden = true;
  // POST 不是 GET：发卷会在服务端落一行 task_sets，GET 语义上应当是安全的。
  const r = await apiFetch(`/api/edu/set?learner_id=${encodeURIComponent(person.id)}`
    + `&course_version_id=${encodeURIComponent(CV)}` + (selectedTopic ? `&topic_id=${encodeURIComponent(selectedTopic)}` : ''), {method: 'POST'});
  if (!r.ok) {
    $('questions').innerHTML = `<div class="card"><div class="prompt">Error ${r.status}</div></div>`;
    return;
  }
  const d = await r.json();
  if (d.pending_submission) {
    const recovered = await apiFetch('/api/edu/set/recover', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({learner_id: person.id, course_version_id: CV, set_id: d.set_id}),
    });
    const result = await recovered.json();
    if (recovered.ok) {
      renderReview(result);
      await loadProgress();
    } else {
      $('questions').innerHTML = `<div class="card"><div class="prompt">${esc(result.detail || '已保存作答，判分尚未完成')}</div><button id="retrySaved">重试已保存的作答</button></div>`;
      $('retrySaved').onclick = loadSet;
    }
    return;
  }
  setItems = d.items || [];
  setId = d.set_id;
  openSetId = setId;
  if (!setItems.length) {
    $('questions').innerHTML = '<div class="card"><div class="prompt">'
      + esc(d.message || '暂时没有可做的题，可以返回讲义或选择其他主题。')
      + '</div></div>';
    return;
  }
  $('questions').innerHTML = setItems.map(renderQuestion).join('');
  wireOptions();
  $('submit').disabled = false;
  await loadProgress();
}

async function loadCourseContent() {
  const query = `learner_id=${encodeURIComponent(person.id)}&course_version_id=${encodeURIComponent(CV)}`;
  try {
    const [lr, rr] = await Promise.all([apiFetch('/api/edu/lessons?' + query), apiFetch('/api/edu/readiness?' + query)]);
    if (!lr.ok || !rr.ok) throw new Error('课程材料状态暂时不可用');
    const [l, r] = await Promise.all([lr.json(), rr.json()]);
    const links = l.lessons.map(x => `<p><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)} · 讲解与例题</a></p>`).join('');
    $('courseContent').innerHTML = `<div class="node"><b>Learning materials</b>${r.content_mode === 'trial' ? ' · 内容试用' : ''}</div>`
      + (links || '<p class="muted">本课程的讲解材料尚未发布。</p>')
      + (r.gaps.length ? `<details><summary>${r.gaps.length} 个主题暂未提供可选练习</summary><ul>${r.gaps.map(g => `<li>${esc(g.title)}</li>`).join('')}</ul></details>` : '');
  } catch (e) { $('courseContent').textContent = e.message; }
}

function renderFigure(url, i) {
  return url ? `<figure style="margin:1rem 0"><img class="question-figure" src="${esc(url)}" alt="Diagram for question ${i + 1}" style="display:block;max-width:100%;height:auto"><figcaption><a href="${esc(url)}" target="_blank" rel="noopener">放大查看图形</a></figcaption></figure>` : '';
}

function renderQuestion(item, i) {
  const kp = item.node
    ? `<div class="node"><b>${esc(item.node.title)}</b> · ${esc(item.node.code)}`
      + `${item.node.standard_code ? ' · ' + esc(item.node.standard_code) : ''}</div>`
    : '';
  // 选择题发单选按钮。此前选项拼在 prompt 散文里，孩子只能手打字母。
  const body = item.choices
    ? item.choices.map(c => `<label class="opt">`
        + `<input type="radio" name="q${i}" value="${esc(c.label)}">`
        + `<span class="lab">${esc(c.label)}</span><span>${esc(c.text)}</span></label>`).join('')
    : `<input type="text" id="a${i}" autocomplete="off" autocapitalize="off"
              spellcheck="false" placeholder="Your answer">`;
  return `<div class="card">
    <div class="qnum">Question ${i + 1} / ${setItems.length}</div>
    ${kp}
    <div class="prompt">${esc(item.prompt)}</div>
    ${renderFigure(item.figure_url, i)}
    ${body}
    ${item.attribution ? `<div class="attrib">${esc(item.attribution)}</div>` : ''}
  </div>`;
}

function wireOptions() {
  document.querySelectorAll('.opt input').forEach(input => {
    input.addEventListener('change', () => {
      document.querySelectorAll(`.opt input[name="${input.name}"]`)
        .forEach(o => o.closest('.opt').classList.toggle('picked', o.checked));
    });
  });
}

function collectAnswers() {
  return setItems.map((item, i) => {
    const picked = document.querySelector(`input[name="q${i}"]:checked`);
    const typed = $(`a${i}`);
    // 幂等键由服务端从 (组, 题) 派生 —— 客户端自选的话，重试时换个新键就等于
    // 自己把去重关掉了（第五轮质检席实测：3 路并发即让同一题落 2 条矛盾作答）。
    return {
      item_id: item.id,
      response: picked ? picked.value : (typed ? typed.value : ''),
    };
  });
}

async function submitSet() {
  if (!setItems.length) return;
  const answers = collectAnswers();
  const blank = answers.filter(a => !a.response.trim()).length;
  // 不硬拦空白：留白本身也是证据。但要让孩子确认这是有意的，别手滑交白卷。
  if (blank && ++blankConfirms < 2) {
    $('submitHint').textContent = `还有 ${blank} 题没作答。再点一次就按空白交上去。`;
    $('submit').textContent = '确认提交（含空白）';
    return;
  }
  $('submit').disabled = true;
  $('submitHint').textContent = '判分中…';
  const r = await apiFetch('/api/edu/set/submit', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({learner_id: person.id, course_version_id: CV, set_id: setId, answers}),
  });
  const d = await r.json();
  if (!r.ok) {
    $('submitHint').textContent = d.detail || `Error ${r.status}`;
    $('submit').disabled = false;
    return;
  }
  renderReview(d);
  await loadProgress();
}

const SOURCE_LABEL = {
  publisher_official: '出版社官方解答', authored: '自撰', derived: '由推导答案倒推',
};

function renderReview(d) {
  const s = d.summary;
  $('score').innerHTML = `答对 ${s.correct} / ${s.auto_graded}`
    + (s.awaiting_review ? ` <span class="muted">· ${s.awaiting_review} 题等大人看</span>` : '');
  $('reviewList').innerHTML = d.results.map((r, i) => {
    const cls = r.needs_judgment ? 'wait' : (r.is_correct ? 'ok' : 'no');
    const mark = r.needs_judgment ? '等大人看' : (r.is_correct ? '✓ 对' : '✗ 错');
    const label = v => {
      const c = (r.choices || []).find(x => x.label === v);
      return c ? `${esc(v)}. ${esc(c.text)}` : esc(v || '（空白）');
    };
    // 讲解缺了就明说，不编：全库 179 题只有 19 题有出版社官方解答。
    const exp = r.explanation
      ? `<div class="exp">${esc(r.explanation)}</div><div class="kp">讲解来源：`
        + `${esc(SOURCE_LABEL[r.explanation_source] || r.explanation_source || '未标注')}</div>`
      : '<div class="exp todo">讲解待补 —— 这道题还没有可信的讲解，先看下面的知识点。</div>';
    const kp = r.knowledge_point
      ? `<div class="kp">关联知识点：<b>${esc(r.knowledge_point.title)}</b> · `
        + `${esc(r.knowledge_point.code)}`
        + `${r.knowledge_point.standard_code ? ' · ' + esc(r.knowledge_point.standard_code) : ''}</div>`
      : '';
    return `<div class="card"><div class="rev ${cls}">
      <div class="qnum">Question ${i + 1} · ${mark}</div>
      <div class="q">${esc(r.prompt)}</div>
      ${renderFigure(r.figure_url, i)}
      <div class="line">你的答案：${label(r.your_response)}</div>
      ${r.needs_judgment ? '' : `<div class="line">正确答案：${label(r.correct_answer)}</div>`}
      ${exp}${kp}
    </div></div>`;
  }).join('');
  show('reviewView');
}

function evidenceLabel(e) {
  if (!e) return '';
  return `不同题答对 ${e.distinct_correct_items} · 间隔 ${e.delay_hours} 小时后答对 ${e.delayed_correct_items} · 迁移尚未评估`
    + (e.model_judged_attempts ? ' · 模型评分尚未校准' : '');
}
function practiceStatus(status) {
  return ({mastered:'当前练习达标', learning:'练习中', new:'尚未作答'})[status] || status;
}
async function loadProgress() {
  const r = await apiFetch(`/api/edu/progress?learner_id=${encodeURIComponent(person.id)}&course_version_id=${encodeURIComponent(CV)}`);
  if (!r.ok) return;
  const d = await r.json();
  const total = d.nodes.length, mastered = d.counts.mastered || 0;
  $('counts').textContent = `${mastered}/${total} 当前练习达标 · ${d.counts.learning || 0} 练习中`;
  $('barFill').style.width = `${total ? (mastered / total * 100) : 0}%`;
  $('progress').innerHTML = d.nodes.filter(n => n.status !== 'new').slice(0, 12)
    .map(n => `<tr><td>${esc(n.title)}<div class="muted">${esc(evidenceLabel(n.learning_evidence))}</div></td><td class="s">${esc(practiceStatus(n.status))}${n.score !== null ? ' · ' + n.score : ''}</td></tr>`)
    .join('') || '<tr><td class="s">还没有作答</td></tr>';
}

// ---------- 家长：只读 ----------
async function loadParent(people) {
  const response = await apiFetch(`/api/edu/review-queue?course_version_id=${encodeURIComponent(CV)}`);
  const q = await response.json();
  if (!response.ok) {
    $('pending').textContent = q.detail || '家长身份验证失败';
    $('parentProgress').textContent = '';
    return;
  }
  $('pending').innerHTML = q.pending.length ? q.pending.map(p => `
    <div class="pending" data-attempt="${esc(p.attempt_id)}">
      <div class="q"><b>${esc(p.learner_id)}</b> · ${esc(p.node)} · ${esc(p.submitted_at.slice(0, 16).replace('T', ' '))}</div>
      <div class="q">${esc(p.prompt ? p.prompt.slice(0, 160) : '')}</div>
      <div class="a">「${esc(p.answer)}」</div>
      <div class="q">${p.judge ? `AI: ${esc(p.judge.verdict)} (${esc(p.judge.confidence)}) — ${esc(p.judge.rationale || '')}` : 'AI 未给出判定'}</div>
      <div class="judge-row">
        <button class="j" data-v="correct">判为对</button>
        <button class="j" data-v="partial">部分对</button>
        <button class="j" data-v="incorrect">判为错</button>
        <span class="muted result"></span>
      </div>
    </div>`).join('') : '<div class="muted">没有待复核的作答</div>';

  // 人的裁定是追加不是修改：AI 那条判定原样留在证据链里。
  document.querySelectorAll('.pending .j').forEach(btn => {
    btn.onclick = async () => {
      const box = btn.closest('.pending');
      box.querySelectorAll('.j').forEach(b => b.disabled = true);
      const r = await apiFetch('/api/edu/review', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          reviewer: person.id, attempt_id: box.dataset.attempt, verdict: btn.dataset.v
        })
      });
      const d = await r.json();
      box.querySelector('.result').textContent = r.ok
        ? `已记录：${d.verdict} → ${practiceStatus(d.mastery.status)} ${d.mastery.score.toFixed(2)}`
        : `失败：${d.detail}`;
      if (r.ok) setTimeout(() => loadParent(people), 1200);
    };
  });

  const learners = people.filter(p => p.role === 'learner');
  const blocks = await Promise.all(learners.map(async p => {
    const d = await (await apiFetch(`/api/edu/progress?learner_id=${encodeURIComponent(p.id)}&course_version_id=${encodeURIComponent(CV)}`)).json();
    const rows = d.nodes.filter(n => n.status !== 'new')
      .map(n => `<tr><td>${esc(n.title)}<div class="muted">${esc(evidenceLabel(n.learning_evidence))}</div></td><td class="s">${esc(practiceStatus(n.status))}${n.score !== null ? ' · ' + n.score : ''}</td></tr>`).join('');
    return `<div class="node" style="margin-top:14px"><b>${esc(p.display_name)}</b> · ${d.counts.mastered || 0} 当前练习达标 · ${d.counts.learning || 0} 练习中</div>
            <table>${rows || '<tr><td class="s">还没有作答</td></tr>'}</table>`;
  }));
  $('parentProgress').innerHTML = blocks.join('');
}

$('submit').addEventListener('click', () => submitSet().catch(error => { $('submit').disabled = false; showError(error); }));
$('again').addEventListener('click', () => loadStudy().catch(showError));
boot().catch(showError);
</script>
