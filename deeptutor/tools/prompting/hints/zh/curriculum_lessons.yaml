short_description: "按课程标准编号查出讲授该标准的课文内容。"
when_to_use: "当学习者的困难已经定位到某个标准编号时使用——来自诊断结果、掌握度报告，或题目本身标注的标准。此时需要的是真正讲这个标准的教材，而不是相似的文字。"
input_format: "{\"standard_code\": \"课程标准编号，如 '4.NF.B.3'\", \"kb_name\": \"挂载的某个知识库名称\"}。"
guideline: "只要手上有标准编号，就优先用本工具而不是 rag。检索匹配的是措辞，把 '4.NF.B.3' 丢给 rag 只会返回字面相近的片段，而不是真正讲这个标准的课；本工具走的是教材自带的标准对齐关系。返回为空是一个确切的答案——说明索引里没有任何一课讲该标准，此时不要改用 rag 再查一遍、把返回的内容当作该标准的教材。"
note: "只有基于标准对齐课程建立的知识库才带这层对齐关系，其他知识库一律返回空。粗粒度编号（如 '4.NF.B'）会匹配其下的全部细分标准。"
phase: "exploration"
